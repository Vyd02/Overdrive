name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore signing key
        env:
          KS: ${{ secrets.OVERDRIVE_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then echo "Add the OVERDRIVE_KEYSTORE secret first"; exit 1; fi
          echo "$KS" | base64 -d > overdrive.jks
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Overdrive.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: Overdrive.apk
